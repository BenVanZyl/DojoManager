name: Release and Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (optional for manual deployment)
        required: false
        type: string
      deploy:
        description: Deploy build outputs via FTPS
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANGULAR_ARTIFACT_BASE: angular-dist
  API_ARTIFACT_BASE: api-publish

jobs:
  build-angular:
    name: Build Angular Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DojoManager.Angular
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DojoManager.Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod

      - name: Ensure IIS web.config is included in the build output
        run: cp public/web.config dist/DojoManager/browser/web.config

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: DojoManager.Angular/dist/DojoManager/browser/**
          if-no-files-found: error

  build-api:
    name: Build API Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore DojoManager.Api/DojoManager.Api.csproj

      - name: Publish API
        run: dotnet publish DojoManager.Api/DojoManager.Api.csproj --configuration Release --no-restore --output DojoManager.Api/publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: DojoManager.Api/publish/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-angular
      - build-api
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download Angular artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: release/angular

      - name: Download API artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: release/api

      - name: Create release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          mkdir -p out
          archive_tag="${RELEASE_TAG//\//-}"
          cd release
          zip -qr "../out/angular-dist-${archive_tag}.zip" angular
          zip -qr "../out/api-publish-${archive_tag}.zip" api

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            out/*.zip

  deploy-ftps:
    name: Deploy via FTPS
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-ftps-deploy
      cancel-in-progress: false
    needs:
      - build-angular
      - build-api
      - publish-release
    if: >-
      ${{ !cancelled() && needs.build-angular.result == 'success' && needs.build-api.result == 'success'
          && (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped')
          && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: deploy/angular

      - name: Download API artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: deploy/api

      - name: Deploy Angular
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          security: strict
          local-dir: deploy/angular/
          server-dir: /jkajoondalup.com/
          exclude: |
            api/**

      - name: Deploy API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          security: strict
          local-dir: deploy/api/
          server-dir: /jkajoondalup.com/api/
