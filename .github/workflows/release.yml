name: Release and Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish/deploy (required for manual release)
        required: false
        type: string
      deploy:
        description: Deploy build outputs to IIS via Web Deploy
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANGULAR_ARTIFACT_BASE: angular-dist
  API_ARTIFACT_BASE: api-publish

jobs:
  build-angular:
    name: Build Angular Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DojoManager.Angular
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DojoManager.Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod

      - name: Ensure IIS web.config is included in the build output
        run: cp public/web.config dist/DojoManager/browser/web.config

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: DojoManager.Angular/dist/DojoManager/browser/**
          if-no-files-found: error

  build-api:
    name: Build API Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore DojoManager.Api/DojoManager.Api.csproj

      - name: Publish API
        run: dotnet publish DojoManager.Api/DojoManager.Api.csproj --configuration Release --no-restore --output DojoManager.Api/publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: DojoManager.Api/publish/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-angular
      - build-api
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    outputs:
      release_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: release/angular

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: release/api

      - name: Create release archives
        shell: bash
        run: |
          mkdir -p out
          tar -a -c -f out/angular-dist-${{ steps.tag.outputs.value }}.zip -C release angular
          tar -a -c -f out/api-publish-${{ steps.tag.outputs.value }}.zip -C release api

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            out/angular-dist-${{ steps.tag.outputs.value }}.zip
            out/api-publish-${{ steps.tag.outputs.value }}.zip

  deploy-webdeploy:
    name: Deploy to IIS via Web Deploy
    runs-on: windows-latest
    environment: production
    needs:
      - build-angular
      - build-api
      - publish-release
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.release_tag != '') }}
    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: deploy/angular

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: deploy/api

      - name: Install Web Deploy
        shell: pwsh
        run: |
          $msdeploy = Join-Path $env:ProgramFiles 'IIS\Microsoft Web Deploy V3\msdeploy.exe'
          if (-not (Test-Path $msdeploy)) {
            choco install webdeploy -y --no-progress
          }

      - name: Deploy Angular to IIS site root
        shell: pwsh
        env:
          WEBDEPLOY_SERVER: ${{ secrets.PCA_WEBDEPLOY_SERVER }}
          WEBDEPLOY_USERNAME: ${{ secrets.PCA_WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.PCA_WEBDEPLOY_PASSWORD }}
          WEBDEPLOY_SITE: ${{ secrets.PCA_WEBDEPLOY_SITE_ANGULAR }}
        run: |
          $msdeploy = Join-Path $env:ProgramFiles 'IIS\Microsoft Web Deploy V3\msdeploy.exe'
          if (-not (Test-Path $msdeploy)) {
            throw 'Web Deploy was not found after installation.'
          }

          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_SERVER)) {
            throw 'PCA_WEBDEPLOY_SERVER is required.'
          }

          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_SITE)) {
            throw 'PCA_WEBDEPLOY_SITE is required.'
          }

          & $msdeploy `
            -verb:sync `
            -source:contentPath="${{ github.workspace }}\deploy\angular" `
            -dest:iisApp="$env:WEBDEPLOY_SITE",computerName="$env:WEBDEPLOY_SERVER",userName="$env:WEBDEPLOY_USERNAME",password="$env:WEBDEPLOY_PASSWORD",authtype="Basic" `
            -allowUntrusted

      - name: Deploy API to IIS api application
        shell: pwsh
        env:
          WEBDEPLOY_SERVER: ${{ secrets.PCA_WEBDEPLOY_SERVER }}
          WEBDEPLOY_USERNAME: ${{ secrets.PCA_WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.PCA_WEBDEPLOY_PASSWORD }}
          WEBDEPLOY_SITE: ${{ secrets.PCA_WEBDEPLOY_SITE_ANGULAR}}
        run: |
          $msdeploy = Join-Path $env:ProgramFiles 'IIS\Microsoft Web Deploy V3\msdeploy.exe'
          if (-not (Test-Path $msdeploy)) {
            throw 'Web Deploy was not found after installation.'
          }

          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_SERVER)) {
            throw 'PCA_WEBDEPLOY_SERVER is required.'
          }

          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_SITE)) {
            throw 'PCA_WEBDEPLOY_SITE is required.'
          }

          $apiPath = "$env:WEBDEPLOY_SITE/api"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="${{ github.workspace }}\deploy\api" `
            -dest:iisApp="$apiPath",computerName="$env:WEBDEPLOY_SERVER",userName="$env:WEBDEPLOY_USERNAME",password="$env:WEBDEPLOY_PASSWORD",authtype="Basic" `
            -allowUntrusted
