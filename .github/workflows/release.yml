name: Release and Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish/deploy (required for manual release)
        required: false
        type: string
      deploy:
        description: Deploy build outputs to FTPS
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANGULAR_ARTIFACT_BASE: angular-dist
  API_ARTIFACT_BASE: api-publish

jobs:
  build-angular:
    name: Build Angular Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DojoManager.Angular
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DojoManager.Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: DojoManager.Angular/dist/DojoManager/browser/**
          if-no-files-found: error

  build-api:
    name: Build API Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore DojoManager.Api/DojoManager.Api.csproj

      - name: Publish API
        run: dotnet publish DojoManager.Api/DojoManager.Api.csproj --configuration Release --no-restore --output DojoManager.Api/publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: DojoManager.Api/publish/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-angular
      - build-api
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    outputs:
      release_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: release/angular

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: release/api

      - name: Create release archives
        shell: bash
        run: |
          mkdir -p out
          tar -a -c -f out/angular-dist-${{ steps.tag.outputs.value }}.zip -C release angular
          tar -a -c -f out/api-publish-${{ steps.tag.outputs.value }}.zip -C release api

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            out/angular-dist-${{ steps.tag.outputs.value }}.zip
            out/api-publish-${{ steps.tag.outputs.value }}.zip

  deploy-ftps:
    name: Deploy to FTPS
    runs-on: ubuntu-latest
    environment: production
    needs:
      - build-angular
      - build-api
      - publish-release
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.release_tag != '') }}
    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ANGULAR_ARTIFACT_BASE }}-${{ github.run_id }}
          path: deploy/angular

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT_BASE }}-${{ github.run_id }}
          path: deploy/api

      - name: Deploy Angular to FTPS /public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PCA_FTP_SERVER }}
          username: ${{ secrets.PCA_FTP_USERNAME }}
          password: ${{ secrets.PCA_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: deploy/angular/
          server-dir: /public_html/

      - name: Deploy API to FTPS /api
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PCA_FTP_SERVER }}
          username: ${{ secrets.PCA_FTP_USERNAME }}
          password: ${{ secrets.PCA_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: deploy/api/
          server-dir: /api/
