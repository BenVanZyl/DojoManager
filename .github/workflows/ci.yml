name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    name: Angular Build, Test, and Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DojoManager.Angular
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DojoManager.Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Run npm audit (high+)
        run: npm audit --audit-level=high

  api:
    name: API Build and Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore DojoManager.Api/DojoManager.Api.csproj

      - name: Build API
        run: dotnet build DojoManager.Api/DojoManager.Api.csproj --configuration Release --no-restore

      - name: Check vulnerable NuGet packages
        shell: bash
        run: |
          output="$(dotnet list DojoManager.Api/DojoManager.Api.csproj package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -qi "has the following vulnerable packages"; then
            echo "Vulnerable packages found in API dependencies."
            exit 1
          fi

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs:
      - angular
      - api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Snyk token exists
        shell: bash
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "SNYK_TOKEN secret is required for CI security gates."
            exit 1
          fi

      - name: Setup Node for Snyk CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET for Snyk CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Run Snyk test (all projects, high+)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build API for CodeQL
        if: matrix.language == 'csharp'
        run: |
          dotnet restore DojoManager.Api/DojoManager.Api.csproj
          dotnet build DojoManager.Api/DojoManager.Api.csproj --configuration Release --no-restore

      - name: Setup Node for CodeQL JavaScript extraction
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DojoManager.Angular/package-lock.json

      - name: Install Angular dependencies for CodeQL
        if: matrix.language == 'javascript-typescript'
        run: npm ci
        working-directory: DojoManager.Angular

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
